<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b12">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- icone ricavate da arts/favicon.png (originale 1254x1254) -->
  <link rel="icon" type="image/png" sizes="32x32" href="arts/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="arts/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="arts/icons/apple-touch-icon.png">
  <title>BAF2D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <canvas id="ui"></canvas>
  </div>

  <!-- Menu: pannello laterale sinistro; a destra si vede la partita dimostrativa (tutti bot) sul canvas di gioco.
       Le schermate sono <section data-screen>, i contenuti dinamici li riempie js/menu.js -->
  <div id="menu" class="hidden">
    <!-- scena animata del menu principale (js/menu_scene.js, config/menu_scene.json) -->
    <canvas id="menu-scene" class="hidden"></canvas>
    <div class="menu-shade"></div>
    <aside class="menu-panel">
      <header class="menu-logo">
        <h1>BAF2D</h1>
        <p data-i18n="menu.tagline"></p>
      </header>

      <section class="menu-screen" data-screen="main">
        <nav class="menu-list">
          <button type="button" class="menu-item" data-go="newGame" data-i18n="menu.newGame"></button>
          <!-- addestramento: esercizi guidati sul campo d'addestramento (config/training.json) -->
          <button type="button" class="menu-item" data-action="training" data-i18n="menu.training"></button>
          <button type="button" class="menu-item" data-go="soldier" data-i18n="menu.soldier"></button>
          <button type="button" class="menu-item" data-go="medals" data-i18n="menu.medals"></button>
          <button type="button" class="menu-item" data-go="options" data-i18n="menu.options"></button>
          <!-- editor di mappe (editor.html, solo desktop: serve il mouse) -->
          <button type="button" class="menu-item desktop-only" data-action="editor" data-i18n="menu.editor"></button>
        </nav>
        <!-- grado e punti di carriera del giocatore (riempito da menu.js) -->
        <div id="menu-career" class="career compact"></div>
      </section>

      <section class="menu-screen" data-screen="pause">
        <h2 class="menu-title" data-i18n="menu.paused"></h2>
        <nav class="menu-list">
          <button type="button" class="menu-item" data-action="resume" data-i18n="menu.resume"></button>
          <button type="button" class="menu-item" data-go="options" data-i18n="menu.options"></button>
          <button type="button" class="menu-item" data-action="quit" data-i18n="menu.quit"></button>
        </nav>
      </section>

      <section class="menu-screen wide" data-screen="newGame">
        <h2 class="menu-title" data-i18n="newGame.title"></h2>
        <div class="newgame-grid">
          <div class="newgame-col">
            <h3 class="menu-label" data-i18n="newGame.map"></h3>
            <div id="map-list" class="map-list"></div>
          </div>
          <div class="newgame-col">
            <h3 class="menu-label" data-i18n="newGame.team"></h3>
            <div id="team-choice" class="segmented"></div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.difficulty"></h3>
              <div class="stepper" data-stepper="difficulty"></div>
            </div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.allies"></h3>
              <div class="stepper" data-stepper="allies"></div>
            </div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.enemies"></h3>
              <div class="stepper" data-stepper="enemies"></div>
            </div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.tickets"></h3>
              <div class="stepper" data-stepper="tickets"></div>
            </div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.timeLimit"></h3>
              <div class="stepper" data-stepper="timeLimit"></div>
            </div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.timeOfDay"></h3>
              <div class="stepper" data-stepper="timeOfDay"></div>
            </div>
            <div class="stepper-row">
              <h3 class="menu-label" data-i18n="newGame.weather"></h3>
              <div class="stepper" data-stepper="weather"></div>
            </div>
            <p id="newgame-summary" class="newgame-summary"></p>
            <p class="menu-note" data-i18n="start.objective"></p>
          </div>
        </div>
        <div class="menu-actions">
          <button type="button" class="menu-item primary" data-action="start" data-i18n="newGame.start"></button>
          <button type="button" class="menu-item small" data-back data-i18n="menu.back"></button>
        </div>
      </section>

      <!-- personalizzazione del soldato del giocatore (salvata in localStorage, config/soldier.json, js/soldier_art.js) -->
      <section class="menu-screen wide" data-screen="soldier">
        <h2 class="menu-title" data-i18n="soldier.title"></h2>
        <div class="soldier-grid">
          <div class="soldier-options">
            <label class="menu-label" for="soldier-name" data-i18n="soldier.name"></label>
            <input id="soldier-name" class="soldier-name" type="text" autocomplete="off" spellcheck="false">
            <div id="soldier-rows" class="soldier-rows"></div>
            <div id="soldier-stats" class="soldier-stats"></div>
          </div>
          <div class="soldier-preview">
            <canvas id="soldier-canvas" class="soldier-canvas"></canvas>
            <div id="soldier-tape" class="soldier-tape"></div>
          </div>
        </div>
        <div class="menu-actions">
          <button type="button" class="menu-item small" data-action="randomSoldier" data-i18n="soldier.random"></button>
          <button type="button" class="menu-item small" data-back data-i18n="menu.back"></button>
        </div>
      </section>

      <!-- medagliere: tutte le medaglie, quante volte prese (js/game/medals.js, config/medals.json) -->
      <section class="menu-screen wide" data-screen="medals">
        <h2 class="menu-title" data-i18n="medalBook.title"></h2>
        <p id="medal-summary" class="newgame-summary"></p>
        <div id="medal-grid" class="medal-grid"></div>
        <div class="menu-actions">
          <button type="button" class="menu-item small" data-back data-i18n="menu.back"></button>
        </div>
      </section>

      <section class="menu-screen" data-screen="options">
        <h2 class="menu-title" data-i18n="options.title"></h2>
        <h3 class="menu-label" data-i18n="options.language"></h3>
        <div id="lang-choice" class="segmented"></div>
        <h3 class="menu-label" data-i18n="options.volume"></h3>
        <div class="volume-row">
          <input id="volume" type="range" min="0" max="100" step="5">
          <span id="volume-value" class="volume-value"></span>
        </div>
        <h3 class="menu-label" data-i18n="options.musicVolume"></h3>
        <div class="volume-row">
          <input id="music-volume" type="range" min="0" max="100" step="5">
          <span id="music-volume-value" class="volume-value"></span>
        </div>
        <h3 class="menu-label" data-i18n="options.autoReload"></h3>
        <div id="autoreload-choice" class="segmented">
          <button type="button" class="seg" data-value="on" data-i18n="options.on"></button>
          <button type="button" class="seg" data-value="off" data-i18n="options.off"></button>
        </div>
        <p class="menu-note" data-i18n="options.autoReloadHint"></p>
        <h3 class="menu-label" data-i18n="options.damageNumbers"></h3>
        <div id="damagenumbers-choice" class="segmented">
          <button type="button" class="seg" data-value="on" data-i18n="options.on"></button>
          <button type="button" class="seg" data-value="off" data-i18n="options.off"></button>
        </div>
        <h3 class="menu-label" data-i18n="options.quality"></h3>
        <div id="quality-choice" class="segmented">
          <button type="button" class="seg" data-value="high" data-i18n="options.qualityHigh"></button>
          <button type="button" class="seg" data-value="low" data-i18n="options.qualityLow"></button>
        </div>
        <p class="menu-note" data-i18n="options.qualityHint"></p>
        <h3 class="menu-label" data-i18n="options.grain"></h3>
        <div id="grain-choice" class="segmented">
          <button type="button" class="seg" data-value="on" data-i18n="options.on"></button>
          <button type="button" class="seg" data-value="off" data-i18n="options.off"></button>
        </div>
        <h3 class="menu-label desktop-only" data-i18n="options.crosshair"></h3>
        <div id="crosshair-choice" class="segmented crosshair-choice desktop-only"></div>
        <h3 class="menu-label" data-i18n="options.controls"></h3>
        <div class="controls-desktop">
          <div id="key-list" class="key-list"></div>
          <p id="key-hint" class="menu-note key-hint"></p>
          <p class="menu-note" data-i18n="options.mouse"></p>
          <button type="button" class="menu-item small" data-action="resetKeys" data-i18n="options.resetKeys"></button>
        </div>
        <p class="controls-touch menu-note" data-i18n="start.hintTouch"></p>
        <div class="menu-actions">
          <button type="button" class="menu-item small" data-back data-i18n="menu.back"></button>
        </div>
      </section>
      <!-- versione del gioco in fondo al pannello (solo nel menu principale) -->
      <div id="menu-version" class="menu-version"></div>
    </aside>
  </div>

  <!-- pausa su touch (su desktop: Esc / P) -->
  <button type="button" id="pause-button" class="pause-button hidden" data-i18n-title="menu.pause"></button>

  <!-- schermata di rientro (js/deploy.js): mappa tattica, punti di rientro (base, bandiere, compagni), conferma -->
  <div id="overlay-deploy" class="overlay deploy hidden">
    <div class="panel deploy-panel">
      <div class="deploy-head">
        <h2 class="deploy-title" data-i18n="deploy.title"></h2>
        <p id="deploy-killed" class="deploy-killed"></p>
      </div>
      <div class="deploy-body">
        <div class="deploy-map-box"><canvas id="deploy-map" class="deploy-map"></canvas></div>
        <div class="deploy-side">
          <div id="deploy-list" class="deploy-list"></div>
          <p id="deploy-timer" class="deploy-timer"></p>
          <button type="button" id="deploy-go" class="menu-item primary deploy-go"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- titolo e sottotitolo in base all'esito (matchEnd.victory/defeat/draw), classifica e carriera: menu.js -->
  <div id="overlay-matchend" class="overlay hidden">
    <div class="panel matchend-panel">
      <!-- illustrazione: la zona dei combattimenti più intensi con i caduti (Game.battleArt) e l'esito sopra -->
      <div class="matchend-art">
        <canvas id="matchend-art"></canvas>
        <div class="matchend-head">
          <h1 id="matchend-title" class="matchend-title"></h1>
          <p id="matchend-subtitle"></p>
        </div>
        <p id="matchend-place" class="matchend-place"></p>
      </div>
      <div id="scoreboard" class="scoreboard"></div>
      <div id="matchend-medals" class="medal-strip"></div>
      <div id="matchend-career" class="career"></div>
      <div class="matchend-actions">
        <button type="button" class="menu-item primary" data-action="rematch" data-i18n="matchEnd.rematch"></button>
        <button type="button" class="menu-item" data-action="menu" data-i18n="matchEnd.menu"></button>
      </div>
    </div>
  </div>

  <!-- briefing all'avvio della partita (Menu.launch): mappa che scorre, condizioni, obiettivo, consiglio -->
  <div id="overlay-briefing" class="overlay briefing hidden">
    <div class="briefing-view"><canvas id="briefing-map" class="briefing-map"></canvas></div>
    <div class="briefing-card">
      <p class="briefing-kicker" data-i18n="briefing.title"></p>
      <h2 id="briefing-name" class="briefing-name"></h2>
      <ul id="briefing-tags" class="briefing-tags"></ul>
      <!-- storia della mappa (levels.<id>.story delle lingue, o "story" nel livello) -->
      <p id="briefing-story" class="briefing-story"></p>
      <p id="briefing-objective" class="briefing-objective"></p>
      <div class="pixel-bar briefing-bar"><span></span></div>
      <p id="briefing-status" class="briefing-status"></p>
      <p id="briefing-tip" class="briefing-tip"></p>
    </div>
  </div>

  <!-- caricamento all'avvio (main.js): logo, barra a pixel, fase, consiglio -->
  <div id="overlay-loading" class="overlay loading">
    <div class="loading-box">
      <h1 class="loading-logo">BAF2D</h1>
      <div class="pixel-bar"><span id="loading-progress"></span></div>
      <p id="loading-status" class="loading-status"></p>
      <p id="loading-tip" class="loading-tip"></p>
    </div>
  </div>

  <div id="overlay-rotate" class="overlay">
    <div class="panel">
      <div class="rotate-icon"></div>
      <p data-i18n="rotate.message"></p>
    </div>
  </div>

  <div id="overlay-message" class="overlay hidden">
    <div class="panel"><p id="message-text"></p></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
