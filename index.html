<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b12">
  <link rel="manifest" href="manifest.webmanifest">
  <title>BAF2D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <canvas id="ui"></canvas>
  </div>

  <div id="overlay-start" class="overlay hidden">
    <div class="panel">
      <h1>BAF2D</h1>
      <p class="hint-desktop" data-i18n="start.hintDesktop"></p>
      <p class="hint-touch" data-i18n="start.hintTouch"></p>
      <p class="blink" data-i18n="start.tapToStart"></p>
    </div>
  </div>

  <div id="overlay-gameover" class="overlay hidden">
    <div class="panel">
      <h1 class="gameover-title" data-i18n="gameOver.title"></h1>
      <p data-i18n="gameOver.subtitle"></p>
      <p class="blink hint-desktop" data-i18n="gameOver.restartDesktop"></p>
      <p class="blink hint-touch" data-i18n="gameOver.restartTouch"></p>
    </div>
  </div>

  <div id="overlay-rotate" class="overlay">
    <div class="panel">
      <div class="rotate-icon"></div>
      <p data-i18n="rotate.message"></p>
    </div>
  </div>

  <div id="overlay-message" class="overlay">
    <div class="panel"><p id="message-text"></p></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
